<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEAMSURU · 개발 연혁</title>
<meta name="description" content="TEAMSURU가 만드는 것들과, 그동안 바뀌어 온 기록.">
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:title" content="TEAMSURU · 개발 연혁">
<meta property="og:description" content="TEAMSURU가 만드는 것들과, 그동안 바뀌어 온 기록.">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="./" aria-label="TEAMSURU 홈">
    <span class="brand-mark" aria-hidden="true">TS</span>
    <span class="brand-name">TEAMSURU</span>
  </a>
  <div class="topbar-actions">
    <a class="ghost-btn" href="https://github.com/surucc" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      <span>GitHub</span>
    </a>
    <button id="theme-toggle" class="ghost-btn icon-btn" type="button" aria-label="밝게/어둡게 전환">
      <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2Z"/></svg>
    </button>
  </div>
</header>

<main>

  <section class="hero">
    <p class="eyebrow">개발 연혁</p>
    <h1>만든 것과,<br>그동안 바뀐 것.</h1>
    <p class="lede">
      혼자 만들고 혼자 고칩니다. 릴리스마다 남긴 변경 기록을
      각 프로젝트의 <code>CHANGELOG.md</code>에서 그대로 끌어와 여기에 쌓습니다.
    </p>
    <dl class="stats" id="stats" aria-live="polite">
      <div class="stat"><dt>프로젝트</dt><dd class="skeleton-num">–</dd></div>
      <div class="stat"><dt>릴리스</dt><dd class="skeleton-num">–</dd></div>
      <div class="stat"><dt>최근 업데이트</dt><dd class="skeleton-num">–</dd></div>
    </dl>
  </section>

  <section class="section" id="projects-section">
    <div class="section-head">
      <h2>프로젝트</h2>
    </div>
    <div class="project-grid" id="projects"></div>
  </section>

  <section class="section" id="history-section">
    <div class="section-head">
      <h2>연혁</h2>
      <div class="filters" id="filters" role="group" aria-label="프로젝트 선택"></div>
    </div>
    <ol class="timeline" id="timeline"></ol>
    <p class="empty" id="timeline-empty" hidden>해당하는 기록이 없습니다.</p>
  </section>

  <p class="loading" id="loading">기록을 불러오는 중…</p>
  <div class="error-box" id="error" hidden>
    <strong>기록을 불러오지 못했습니다.</strong>
    <span id="error-detail"></span>
  </div>

</main>

<footer class="site-footer">
  <p>
    <a href="https://github.com/surucc" target="_blank" rel="noopener">github.com/surucc</a>
  </p>
  <p class="muted" id="generated">
    이 페이지는 각 프로젝트의 CHANGELOG에서 하루 한 번 자동으로 갱신됩니다.
  </p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
